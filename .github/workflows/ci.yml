# Name shown in the "Actions" tab on GitHub
name: CI

# When it runs: on every push to main and on every pull request targeting main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Type of virtual machine GitHub lends you (Linux, clean on every run)
    runs-on: ubuntu-latest

    steps:
      # The machine starts empty: this step downloads your repo into it
      - name: Check out the code
        uses: actions/checkout@v4

      # Installs Python 3.11 (the same version used locally)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip # stores the downloaded dependencies to speed up future runs

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: python -m pytest -v # "python -m" adds the current folder to the path, so it finds "app"

  # The same tests, but against a real PostgreSQL instead of SQLite.
  # Catches problems that SQLite does not reveal (types, drivers, connection...)
  test-postgres:
    runs-on: ubuntu-latest

    # A "service container" is a container that GitHub starts alongside the job,
    # reachable from the steps on localhost. Here, the database
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tasks
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: tasks
        ports:
          - 5432:5432
        # GitHub does not run the job steps until it is healthy
        options: >-
          --health-cmd "pg_isready -U tasks -d tasks"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # This variable makes the app use PostgreSQL instead of SQLite
    env:
      DATABASE_URL: postgresql+psycopg://tasks:ci-password@localhost:5432/tasks

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests against PostgreSQL
        run: python -m pytest -v

  # Checks that the manifests in k8s/ really work: starts a temporary Kubernetes cluster
  # inside the job's machine, deploys the app and tests it. It is destroyed when finished
  k8s-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # kind = "Kubernetes IN Docker": creates a cluster using containers as if they were nodes
      - name: Create Kubernetes cluster (kind)
        uses: helm/kind-action@v1.15.0
        with:
          # By default the action names it "chart-testing"; with this name "kind load" finds it
          cluster_name: kind

      # The cluster cannot see the images in the machine's Docker: they must be loaded into it.
      # Locally this was not needed because Docker Desktop shares its images with its cluster
      - name: Build the image and load it into the cluster
        run: |
          docker build -t tasks-api:local .
          kind load docker-image tasks-api:local

      # The Secret is not in the repo (it is public), so it is created here with a test password
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl create secret generic postgres-credentials -n tasks \
            --from-literal=POSTGRES_USER=tasks \
            --from-literal=POSTGRES_PASSWORD=ci-k8s-password \
            --from-literal=POSTGRES_DB=tasks
          kubectl apply -f k8s/10-postgres.yaml -f k8s/20-api.yaml

      # "rollout status" waits until all replicas pass their readinessProbe
      - name: Wait until everything is ready
        run: |
          kubectl rollout status statefulset/db -n tasks --timeout=180s
          kubectl rollout status deployment/api -n tasks --timeout=180s

      # A temporary pod calls the "api" Service, just as any other piece of the cluster would
      - name: Test the API through the Service
        run: |
          kubectl run probe --rm -i --restart=Never -n tasks --image=python:3.11-slim --quiet -- \
            python -c "import urllib.request as u; print(u.urlopen('http://api/health').read().decode())"

      # "if: failure()" = only runs if a previous step failed. Leaves clues for debugging
      - name: Show the cluster state if something failed
        if: failure()
        run: |
          kubectl get pods -n tasks -o wide
          kubectl describe pods -n tasks
          kubectl logs -n tasks -l app=api --all-containers --tail=50

  docker:
    # "needs" makes this job wait for the test jobs: if any fails, nothing is published
    needs: [test, test-postgres, k8s-smoke]
    # This job also runs on pull requests: it always builds and scans the image,
    # but only publishes it when the code reaches main (see the "if" of the last step)
    runs-on: ubuntu-latest

    # Permissions of the temporary token GitHub gives this job (minimal by default).
    # packages: write allows pushing images to GitHub's registry
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # Logs in to GHCR (GitHub's image registry).
      # GITHUB_TOKEN is generated by GitHub on every run: no passwords to create or store
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Buildx is Docker's modern build engine; it also keeps the layer cache
      # inside the job, so the second build below reuses what was already built
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # "load: true" leaves the image in the machine's local Docker (without pushing it anywhere)
      # so it can be scanned before deciding whether to publish it
      - name: Build the image (without publishing)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tasks-api:scan

      # Trivy compares everything inside the image (Linux packages and Python libraries)
      # against a public database of known vulnerabilities (CVEs).
      # exit-code 1 = if it finds a serious one, the step fails and the job turns red.
      # ignore-unfixed skips those that do not have a fix yet, since we could not do anything about them
      - name: Scan for vulnerabilities with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tasks-api:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # We only get here if the scan passed. It is published only on a push to main
      # (not on pull requests). Two tags: "latest" (the most recent) and the commit hash
      - name: Publish the image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    # It only deploys if the image has been published (and, by chaining, if the tests passed)
    needs: docker
    # The "docker" job no longer distinguishes between PR and main, so the condition lives here:
    # we only deploy when the code reaches main, never from a pull request
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # A "deploy hook" is a secret Render URL: when it receives a POST request,
      # Render pulls the :latest image from GHCR and starts the new version.
      # The secret is passed through an environment variable so it is not written in the command.
      # --fail makes curl return an error (and the job fail) if Render responds with an error code
      - name: Tell Render to deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
