# Nombre que verás en la pestaña "Actions" de GitHub
name: CI

# Cuándo se ejecuta: en cada push a main y en cada pull request hacia main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Tipo de máquina virtual que GitHub te presta (Linux, limpia en cada ejecución)
    runs-on: ubuntu-latest

    steps:
      # La máquina empieza vacía: este paso descarga tu repo en ella
      - name: Descargar el código
        uses: actions/checkout@v4

      # Instala Python 3.11 (la misma versión que usas en local)
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip # guarda las dependencias descargadas para acelerar futuras ejecuciones

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar el código con ruff
        run: ruff check .

      - name: Ejecutar tests
        run: python -m pytest -v # "python -m" añade la carpeta actual al path, para que encuentre "app"

  docker:
    # "needs" hace que este job espere al de tests: si los tests fallan, no se publica nada
    needs: test
    # Solo publicamos imágenes cuando el código llega a main, no en cada pull request
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Permisos del token temporal que GitHub da a este job (por defecto son mínimos).
    # packages: write permite subir imágenes al registro de GitHub
    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      # Inicia sesión en GHCR (el registro de imágenes de GitHub).
      # GITHUB_TOKEN lo genera GitHub solo en cada ejecución: no hay que crear ni guardar contraseñas
      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Construye la imagen con el Dockerfile y la sube. Le ponemos dos etiquetas (tags):
      # "latest" (siempre la más reciente) y el hash del commit (para identificar cada versión exacta)
      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    # Solo se despliega si la imagen ya está publicada (y, por encadenamiento, si los tests pasaron)
    needs: docker
    runs-on: ubuntu-latest

    steps:
      # Un "deploy hook" es una URL secreta de Render: al hacerle una petición POST,
      # Render descarga la imagen :latest de GHCR y arranca la nueva versión.
      # El secreto se pasa por una variable de entorno para que no aparezca escrito en el comando.
      # --fail hace que curl devuelva error (y el job falle) si Render responde con un código de error
      - name: Avisar a Render para que despliegue
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
