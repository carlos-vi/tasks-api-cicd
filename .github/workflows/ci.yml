# Nombre que verás en la pestaña "Actions" de GitHub
name: CI

# Cuándo se ejecuta: en cada push a main y en cada pull request hacia main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Tipo de máquina virtual que GitHub te presta (Linux, limpia en cada ejecución)
    runs-on: ubuntu-latest

    steps:
      # La máquina empieza vacía: este paso descarga tu repo en ella
      - name: Descargar el código
        uses: actions/checkout@v4

      # Instala Python 3.11 (la misma versión que usas en local)
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip # guarda las dependencias descargadas para acelerar futuras ejecuciones

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar el código con ruff
        run: ruff check .

      - name: Ejecutar tests
        run: python -m pytest -v # "python -m" añade la carpeta actual al path, para que encuentre "app"

  # Los mismos tests, pero contra un PostgreSQL de verdad en lugar de SQLite.
  # Detecta problemas que SQLite no revela (tipos, drivers, conexión...)
  test-postgres:
    runs-on: ubuntu-latest

    # Un "service container" es un contenedor que GitHub arranca junto al job,
    # accesible desde los pasos en localhost. Aquí, la base de datos
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tasks
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: tasks
        ports:
          - 5432:5432
        # Hasta que no esté sana, GitHub no ejecuta los pasos del job
        options: >-
          --health-cmd "pg_isready -U tasks -d tasks"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Esta variable hace que la app use PostgreSQL en vez de SQLite
    env:
      DATABASE_URL: postgresql+psycopg://tasks:ci-password@localhost:5432/tasks

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar tests contra PostgreSQL
        run: python -m pytest -v

  # Comprueba que los manifiestos de k8s/ funcionan de verdad: levanta un clúster de Kubernetes
  # temporal dentro de la máquina del job, despliega la app y la prueba. Se destruye al terminar
  k8s-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      # kind = "Kubernetes IN Docker": crea un clúster usando contenedores como si fueran nodos
      - name: Crear clúster de Kubernetes (kind)
        uses: helm/kind-action@v1.15.0
        with:
          # Por defecto la acción lo llama "chart-testing"; con este nombre "kind load" lo encuentra
          cluster_name: kind

      # El clúster no ve las imágenes del Docker de la máquina: hay que cargarlas dentro.
      # En local no hacía falta porque Docker Desktop comparte las imágenes con su clúster
      - name: Construir la imagen y cargarla en el clúster
        run: |
          docker build -t tasks-api:local .
          kind load docker-image tasks-api:local

      # El Secret no está en el repo (es público), así que se crea aquí con una contraseña de prueba
      - name: Desplegar en Kubernetes
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl create secret generic postgres-credentials -n tasks \
            --from-literal=POSTGRES_USER=tasks \
            --from-literal=POSTGRES_PASSWORD=ci-k8s-password \
            --from-literal=POSTGRES_DB=tasks
          kubectl apply -f k8s/10-postgres.yaml -f k8s/20-api.yaml

      # "rollout status" espera a que todas las réplicas pasen su readinessProbe
      - name: Esperar a que todo esté listo
        run: |
          kubectl rollout status statefulset/db -n tasks --timeout=180s
          kubectl rollout status deployment/api -n tasks --timeout=180s

      # Un pod temporal llama al Service "api", igual que haría cualquier otra pieza del clúster
      - name: Probar la API a través del Service
        run: |
          kubectl run probe --rm -i --restart=Never -n tasks --image=python:3.11-slim --quiet -- \
            python -c "import urllib.request as u; print(u.urlopen('http://api/health').read().decode())"

      # "if: failure()" = solo se ejecuta si algún paso anterior falló. Deja pistas para depurar
      - name: Mostrar el estado del clúster si algo falló
        if: failure()
        run: |
          kubectl get pods -n tasks -o wide
          kubectl describe pods -n tasks
          kubectl logs -n tasks -l app=api --all-containers --tail=50

  docker:
    # "needs" hace que este job espere a los de tests: si alguno falla, no se publica nada
    needs: [test, test-postgres, k8s-smoke]
    # Este job corre también en pull requests: construye y escanea la imagen siempre,
    # pero solo la publica cuando el código llega a main (ver el "if" del último paso)
    runs-on: ubuntu-latest

    # Permisos del token temporal que GitHub da a este job (por defecto son mínimos).
    # packages: write permite subir imágenes al registro de GitHub
    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      # Inicia sesión en GHCR (el registro de imágenes de GitHub).
      # GITHUB_TOKEN lo genera GitHub solo en cada ejecución: no hay que crear ni guardar contraseñas
      - name: Iniciar sesión en GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Buildx es el motor de construcción moderno de Docker; además guarda la caché de capas
      # dentro del job, así que el segundo build de más abajo reutiliza lo ya construido
      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      # "load: true" deja la imagen en el Docker local de la máquina (sin subirla a ningún sitio)
      # para poder escanearla antes de decidir si se publica
      - name: Construir la imagen (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tasks-api:scan

      # Trivy compara todo lo que hay dentro de la imagen (paquetes de Linux y librerías de Python)
      # con una base de datos pública de vulnerabilidades conocidas (CVEs).
      # exit-code 1 = si encuentra alguna grave, el paso falla y el job se pone en rojo.
      # ignore-unfixed ignora las que todavía no tienen arreglo, porque no podríamos hacer nada
      - name: Escanear vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tasks-api:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Solo llegamos aquí si el escaneo pasó. Se publica únicamente al hacer push a main
      # (no en pull requests). Dos etiquetas: "latest" (la más reciente) y el hash del commit
      - name: Publicar la imagen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    # Solo se despliega si la imagen ya está publicada (y, por encadenamiento, si los tests pasaron)
    needs: docker
    # El job "docker" ya no distingue entre PR y main, así que la condición vive aquí:
    # solo desplegamos cuando el código llega a main, nunca desde una pull request
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # Un "deploy hook" es una URL secreta de Render: al hacerle una petición POST,
      # Render descarga la imagen :latest de GHCR y arranca la nueva versión.
      # El secreto se pasa por una variable de entorno para que no aparezca escrito en el comando.
      # --fail hace que curl devuelva error (y el job falle) si Render responde con un código de error
      - name: Avisar a Render para que despliegue
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
