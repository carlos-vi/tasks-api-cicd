<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Tasks</h1>

    <form id="form">
      <input id="title" type="text" maxlength="200" placeholder="What needs to be done?" autocomplete="off" required>
      <button type="submit">Add</button>
    </form>

    <p id="message" role="status"></p>
    <ul id="tasks"></ul>

    <footer>
      UI served by the API itself · <a href="/docs">API documentation</a>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
