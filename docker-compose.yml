# Docker Compose describe TODOS los contenedores de la aplicación en un solo archivo.
# Se arranca con "docker compose up" y se para con "docker compose down".
# Las variables ${...} se leen del archivo .env (copia .env.example a .env)

services:
  # Base de datos PostgreSQL, usando la imagen oficial (no hay que construir nada)
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Un volumen es una carpeta gestionada por Docker que vive FUERA del contenedor.
    # Sin él, los datos se perderían al borrar el contenedor
    volumes:
      - db_data:/var/lib/postgresql/data
    # Cada cierto tiempo Docker ejecuta este comando para saber si la base de datos ya acepta
    # conexiones. "Arrancado" no es lo mismo que "listo"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Tu API, construida con el Dockerfile de esta carpeta
  api:
    build: .
    environment:
      # "db" es el nombre del servicio de arriba: Compose crea una red interna
      # donde los contenedores se encuentran entre sí por su nombre
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000" # puerto de tu PC : puerto del contenedor
    # La API no arranca hasta que la base de datos supere su healthcheck
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
