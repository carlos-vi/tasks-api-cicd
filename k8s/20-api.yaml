# --- API ---
# Deployment: "I always want 2 copies (pods) of this application running".
# If a pod dies, Kubernetes creates another one. If you change the image, it replaces them one by one
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: tasks
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # Init containers run BEFORE the application and must finish successfully.
      # It is the equivalent of "depends_on: service_healthy" in Compose:
      # we wait until PostgreSQL accepts connections
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h db -p 5432; do echo 'waiting for the database...'; sleep 2; done"]
      containers:
        - name: api
          # Image built locally with "docker build -t tasks-api:local ."
          image: tasks-api:local
          imagePullPolicy: IfNotPresent # do not look for it on the internet if it is already here
          ports:
            - containerPort: 8000
          env:
            # First the credentials are loaded from the Secret...
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            # ...and with them DATABASE_URL is built. $(VAR) is replaced by a variable
            # defined above. "db" is the PostgreSQL Service
            - name: DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@db:5432/$(POSTGRES_DB)
          # Readiness: while it fails, the pod receives no traffic (startup, or a temporary problem)
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          # Liveness: if it fails several times in a row, Kubernetes RESTARTS the container
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          # requests = what is reserved; limits = the most it can use
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
---
# Service: a single address ("api") that spreads the requests across the 2 pods
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: tasks
spec:
  selector:
    app: api
  ports:
    - port: 80 # Service port
      targetPort: 8000 # container port
