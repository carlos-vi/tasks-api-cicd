# --- PostgreSQL ---
# The password is NOT in this file (the repo is public). The Secret is created by hand:
#   kubectl create secret generic postgres-credentials -n tasks \
#     --from-literal=POSTGRES_USER=tasks \
#     --from-literal=POSTGRES_PASSWORD=<a-password> \
#     --from-literal=POSTGRES_DB=tasks

# A Service gives a stable name and address inside the cluster.
# The API will connect to "db", just like in Docker Compose
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: tasks
spec:
  selector:
    app: db # sends traffic to the pods with this label
  ports:
    - port: 5432
---
# StatefulSet: like a Deployment but for services with data. Each pod keeps its
# identity and its own disk even if it is recreated
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: tasks
spec:
  serviceName: db
  replicas: 1 # a single database; replicating it properly is a different topic
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          # The variables come from the Secret instead of being written here
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            # Subfolder inside the disk: PostgreSQL complains if the root of the disk is not empty
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # Readiness: "can you receive traffic yet?". Until it answers, the Service sends it nothing
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
  # Disk template: Kubernetes creates a PersistentVolumeClaim for each pod.
  # It is the equivalent of the "db_data" volume in Compose
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
